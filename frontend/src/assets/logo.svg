<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cockpit-like shape -->
  <circle cx="50" cy="50" r="45" fill="url(#gradient)" />
  
  <!-- Dashboard grid lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.3">
    <line x1="30" y1="30" x2="70" y2="30" />
    <line x1="30" y1="40" x2="70" y2="40" />
    <line x1="30" y1="50" x2="70" y2="50" />
    <line x1="30" y1="60" x2="70" y2="60" />
    <line x1="30" y1="70" x2="70" y2="70" />
    
    <line x1="30" y1="30" x2="30" y2="70" />
    <line x1="40" y1="30" x2="40" y2="70" />
    <line x1="50" y1="30" x2="50" y2="70" />
    <line x1="60" y1="30" x2="60" y2="70" />
    <line x1="70" y1="30" x2="70" y2="70" />
  </g>
  
  <!-- Crosshair -->
  <circle cx="50" cy="50" r="15" fill="none" stroke="#ffffff" stroke-width="2" />
  <line x1="50" y1="35" x2="50" y2="65" stroke="#ffffff" stroke-width="2" />
  <line x1="35" y1="50" x2="65" y2="50" stroke="#ffffff" stroke-width="2" />
  
  <!-- Radar lines -->
  <line x1="50" y1="50" x2="75" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.5" />
  <line x1="50" y1="50" x2="75" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.5" />
  <line x1="50" y1="50" x2="75" y2="75" stroke="#ffffff" stroke-width="1" opacity="0.5" />
</svg>